# See store-01-brew.yaml for why this flow uses raw tool steps and coordinates.
executionPrerequisite: >-
  App on the Guide tab with the brew timer running from the previous
  segment.

steps:
  - echo: (0.622, 0.932) is the Tips tab in the custom zine tab bar
  - tap: { x: 0.622, y: 0.932 }
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Grind matters more than beans.
      timeoutMs: 10000
  - wait: 1200
  - echo: (0.5, 0.418) is the first field note row, tips.row.grind
  - tap: { x: 0.5, y: 0.418 }
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Tip · Technique
      timeoutMs: 10000
  - wait: 1500
  - echo: Scroll the article so the drop cap and pull quote read on camera
  - tool: gesture-swipe
    args: { fromX: 0.5, fromY: 0.75, toX: 0.5, toY: 0.4, durationMs: 800 }
  - wait: 1000
