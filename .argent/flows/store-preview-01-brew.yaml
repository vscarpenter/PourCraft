# See store-01-brew.yaml for why this flow uses raw tool steps and coordinates.
steps:
  - tool: launch-app
    args:
      bundleId: com.pourcraft.app
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Choose your roast.
      timeoutMs: 30000
  - wait: 1500
  - echo: (0.5, 0.32) is the Light roast row; ratio and water math update live on camera
  - tap: { x: 0.5, y: 0.32 }
  - wait: 1200
  - echo: (0.895, 0.601) is the Increase dose stepper; three paced taps animate the dose numeral
  - tap: { x: 0.895, y: 0.601 }
  - wait: 500
  - tap: { x: 0.895, y: 0.601 }
  - wait: 500
  - tap: { x: 0.895, y: 0.601 }
  - wait: 1200
