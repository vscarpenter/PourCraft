# PourCraft is pure SwiftUI: argent's flow runner matches selectors against the
# native UIView hierarchy, which SwiftUI leaves empty. So these flows gate on
# raw await-ui-element tool steps (accessibility tree, which sees SwiftUI) and
# tap by normalized coordinates measured with `argent run describe`.
# restart-app (not launch-app) resets each scene: it terminates and relaunches,
# where launch-app would only foreground the previous scene's screen.
steps:
  - tool: restart-app
    args:
      bundleId: com.pourcraft.app
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Choose your roast.
      timeoutMs: 30000
  - tool: await-screen-idle
    args:
      timeoutMs: 10000
