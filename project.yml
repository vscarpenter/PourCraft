name: PourCraft
options:
  bundleIdPrefix: com.pourcraft
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 52HVJ3VDSM

targets:
  PourCraft:
    type: application
    platform: iOS
    sources:
      - path: PourCraft
    settings:
      base:
        INFOPLIST_FILE: PourCraft/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.pourcraft.app
        MARKETING_VERSION: "2.5.0"
        CURRENT_PROJECT_VERSION: "14"
        GENERATE_INFOPLIST_FILE: false
        SWIFT_EMIT_LOC_STRINGS: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: PourCraft/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchIcon
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - "Fraunces[opsz,wght].ttf"
          - "Fraunces-Italic[opsz,wght].ttf"

  PourCraftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PourCraftTests
    dependencies:
      - target: PourCraft
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.pourcraft.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PourCraft.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PourCraft"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PourCraftUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PourCraftUITests
    dependencies:
      - target: PourCraft
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.pourcraft.uitests

schemes:
  PourCraft:
    build:
      targets:
        PourCraft: all
        PourCraftTests: [test]
        PourCraftUITests: [test]
    test:
      targets:
        - PourCraftTests
        - PourCraftUITests
